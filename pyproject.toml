name = "f1"
version = "0.1.0"
description = "A small playground project for Formula 1 points and standings"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Shamimnrb" }]

[tool.setuptools]
packages = ["f1"]
